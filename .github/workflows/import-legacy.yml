name: Import / update legacy posts

# 把 legacy/*.md 同步成 issue：没有就新建，已存在就原地更新正文（保留编号与评论）。
# 注意：用 GITHUB_TOKEN 改 issue 不会触发其他工作流，
# 所以跑完这个之后要手动再运行一次 "Build & Deploy"。

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sync legacy/*.md to issues
        run: node scripts/import-legacy.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
